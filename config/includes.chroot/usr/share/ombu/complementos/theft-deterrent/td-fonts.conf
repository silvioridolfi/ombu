<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Ombú: tipografía oficial (Encode Sans) para el cliente del Theft Deterrent.
       Su biblioteca vieja no entiende la fuente variable y usa su valor de fábrica (Thin condensada, muy finita);
       para este programa se usan copias fijas Regular y Bold y se ignora el archivo variable. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>/usr/share/ombu/td-fuentes</dir>
  <selectfont>
    <rejectfont><glob>/usr/share/fonts/truetype/encodesans/*</glob></rejectfont>
  </selectfont>
</fontconfig>
