GRUB_DISTRIBUTOR="Ombú"
GRUB_TIMEOUT=5
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_THEME="/boot/grub/themes/ombu/theme.txt"
# Resolución: "auto" usa la del panel (si se pide una fija que la placa no ofrece, GRUB cae en 1024x768 y la imagen se ve estirada y borrosa)
GRUB_GFXMODE=auto
GRUB_GFXPAYLOAD_LINUX=keep
# Entrada principal con título simple ("Ombú GNU/Linux"), no "..., with Linux 6.12..."
GRUB_DISABLE_SUBMENU=false
GRUB_DISABLE_OS_PROBER=true
GRUB_DISABLE_RECOVERY=true
# Textos de GRUB en español (los traduce gettext al generar el menú)
export LC_ALL=es_AR.UTF-8
export LANG=es_AR.UTF-8
export LANGUAGE=es