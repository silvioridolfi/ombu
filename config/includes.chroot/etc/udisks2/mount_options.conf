# Ombú: pendrives y tarjetas que se pueden sacar sin «expulsar», como en Windows («quitar de forma segura» no hace falta).
# Los datos se escriben enseguida, sin quedar en memoria. Es algo más lento al copiar archivos grandes, pero no se pierde ni se daña nada.
[defaults]
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush
exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro,sync
ntfs3_defaults=uid=$UID,gid=$GID,windows_names,sync
ntfs_defaults=uid=$UID,gid=$GID,windows_names,sync
udf_defaults=uid=$UID,gid=$GID,sync
