<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Encode Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Encode Sans</family>
    <default><family>sans-serif</family></default>
  </alias>
</fontconfig>
