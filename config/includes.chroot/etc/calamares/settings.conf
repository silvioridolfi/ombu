# Ombú — secuencia del instalador (sin pool de apt en la ISO: instalación 100% offline)
---
modules-search: [ local ]

instances:
- id:     ombupost
  module: shellprocess
  config: shellprocess-ombupost.conf

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - grubcfg
  - bootloader
  - packages
  - shellprocess@ombupost
  - plymouthcfg
  - initramfscfg
  - initramfs
  - umount
- show:
  - finished

branding: ombu
prompt-install: true
dont-chroot: false
