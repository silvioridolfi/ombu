---
defaultGroups:
    - cdrom
    - audio
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
    - sudo
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
passwordRequirements:
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true
userShell: /bin/bash
presets:
    fullName:
        value: "Soporte Técnico Ombú"
        editable: true
    loginName:
        value: "soporte"
        editable: true
