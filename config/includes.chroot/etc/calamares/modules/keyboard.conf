# Ombú — teclado del instalador
# Se conserva la distribución del sistema en vivo (latam, definida al arrancar)
# en vez de adivinarla por el idioma, que daba "Spanish" en lugar de
# "Spanish (Latin American)".
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
guessLayout: false
configure:
    kwin: false
