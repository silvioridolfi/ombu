source /boot/grub/config.cfg

# Tipografía de Ombú para el tema del menú
loadfont /boot/grub/live-theme/ombu-sans-24.pf2
loadfont /boot/grub/live-theme/ombu-sans-17.pf2

set timeout=10

menuentry "Iniciar Ombú" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Ombú (video compatible - G4)" --hotkey=v {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

# PRUEBA (G5): el touchpad Elantech a veces no se detecta o queda como mouse genérico.
menuentry "Ombú (prueba touchpad: i8042.nomux)" --hotkey=n {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ i8042.nomux
	initrd	@INITRD_LIVE@
}

menuentry "Ombú (prueba touchpad: i8042.reset)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ i8042.reset
	initrd	@INITRD_LIVE@
}

menuentry "Ombú (modo a prueba de fallos)" --hotkey=f {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "Configuración del firmware (UEFI)" --hotkey=u {
		fwsetup
	}
fi
