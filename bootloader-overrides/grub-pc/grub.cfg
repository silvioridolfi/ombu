source /boot/grub/config.cfg

set timeout=5

menuentry "Iniciar Ombú" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Ombú (video compatible - G4)" --hotkey=v {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "Ombú (modo a prueba de fallos)" --hotkey=f {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "Configuración del firmware (UEFI)" --hotkey=u {
		fwsetup
	}
fi
